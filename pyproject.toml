[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relayai-core"
version = "0.4.0"
description = "Policy-aware voice pipeline orchestration for RelayAI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Subharthi Saha" },
]
keywords = ["voice", "speech-to-text", "privacy", "automation", "pipelines"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/subharthi99/RelayAI"
Documentation = "https://github.com/subharthi99/RelayAI#readme"
Issues = "https://github.com/subharthi99/RelayAI/issues"
Repository = "https://github.com/subharthi99/RelayAI"

[project.scripts]
relayai = "relayai_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
